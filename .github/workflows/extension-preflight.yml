name: Chrome Extension Release Preflight
on:
  push:
    branches: ['release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    name: Manifest V3 and safe ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check services/extension/background.js
          node --check services/extension/content.js
      - name: Generate icons, verify safety and package
        run: python3 scripts/prepare_cws.py
      - name: Validate artifact
        run: |
          unzip -l dist/linkedin-copilot-*-LEGACY-PREFLIGHT.zip
          test ! -e services/extension/.env
      - uses: actions/upload-artifact@v4
        with:
          name: linkedin-copilot-legacy-qa-only
          path: dist/*-LEGACY-PREFLIGHT.zip
          if-no-files-found: error
