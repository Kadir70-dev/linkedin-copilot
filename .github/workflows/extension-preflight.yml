name: Chrome Extension Release Preflight
on:
  push:
    branches: ['release/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    name: Manifest V3 and safe ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: pip install redis requests
      - name: JavaScript syntax
        run: |
          node --check services/extension/background.js
          node --check services/extension/premium_panel.js
      - name: AI-brain classification tests (production worker.py)
        run: python3 bench/test_classification.py
      - name: Hermes reply harness (offline)
        run: python3 bench/test_hermes_reply.py
      - name: Engine routing (Claude first, Qwen backup)
        run: python3 bench/test_engine_fallback.py
      - name: Connection-note claim gate
        run: python3 bench/test_outreach_claims.py
      - name: Go gateway build
        run: |
          cd services/gateway-go
          go build ./...
          go vet ./...
      - name: Verify safety and package
        run: python3 scripts/package_k70.py
      - uses: actions/upload-artifact@v4
        with:
          name: k70-ai-copilot
          path: dist/k70-ai-copilot-*.zip
          if-no-files-found: error
