<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copilot">
<meta name="theme-color" content="#0a66c2">
<title>LinkedIn Copilot</title>
<style>
  :root { --bg:#f3f2ef; --card:#fff; --text:#1d2226; --muted:#5e6670; --line:#d9dde1; --brand:#0a66c2; --ok:#057642; --err:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1f23; --card:#252a2f; --text:#e8eaed; --muted:#a3abb3; --line:#3a4148; --brand:#70b5f9; --ok:#4cc38a; --err:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:16px 16px 40px; padding-top:max(16px, env(safe-area-inset-top)); }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-weight:600; font-size:14px; margin:10px 0 4px; }
  input, textarea { width:100%; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  textarea { min-height:110px; resize:vertical; }
  button { font:inherit; font-weight:600; border:0; border-radius:20px; padding:11px 16px; background:var(--brand); color:#fff; width:100%; margin-top:12px; }
  button.secondary { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button:disabled { opacity:.55; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { margin:0; background:transparent; color:var(--text); border:1px solid var(--line); }
  .tabs button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .status { font-size:14px; margin-top:10px; color:var(--muted); min-height:20px; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .hint { font-size:13px; color:var(--muted); margin-top:8px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>LinkedIn Copilot</h1>
  <p class="sub">Paste their message, get a draft, copy it, send it yourself.</p>

  <section class="card hidden" id="keyCard">
    <label for="key">Access key</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your access key">
    <button id="saveKey">Save key</button>
    <div class="status" id="keyStatus"></div>
  </section>


  <section class="card" id="replyCard">
    <label for="msg">Their message</label>
    <textarea id="msg" placeholder="Paste the message from LinkedIn"></textarea>
    <button id="getReply">Get suggestion</button>
  </section>


  <section class="card hidden" id="draftCard">
    <label for="draft">Draft (edit if needed)</label>
    <textarea id="draft"></textarea>
    <button id="copy">Copy</button>
    <p class="hint">Then open LinkedIn, paste, check it, and press Send yourself. This page never sends anything.</p>
  </section>

  <div class="status" id="status"></div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "lc_key";
  function getKey() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
  function setKey(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function status(el, text, cls) { el.textContent = text; el.className = "status" + (cls ? " " + cls : ""); }
  function rid(p) { return p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

  async function api(method, path, body) {
    var res = await fetch(path, {
      method: method,
      headers: Object.assign({ "Authorization": "Bearer " + getKey() }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { $("keyCard").classList.remove("hidden"); throw new Error("Access key not accepted. Paste a valid key above."); }
    if (res.status === 429) throw new Error("Too many requests. Wait a minute and try again.");
    if (!res.ok) throw new Error("Server error (" + res.status + "). Try again.");
    return res.json();
  }

  async function poll(path, isDone, timeoutMs) {
    var end = Date.now() + timeoutMs;
    while (Date.now() < end) {
      var d = await api("GET", path);
      if (isDone(d)) return d;
      await sleep(2000);
    }
    throw new Error("The draft is taking too long. Try again in a minute.");
  }

  function busy(btn, on, label) { btn.disabled = on; btn.textContent = on ? "Working…" : label; }
  function showDraft(text) { $("draft").value = text || ""; $("draftCard").classList.remove("hidden"); $("draftCard").scrollIntoView({ behavior: "smooth" }); }

  // key: a private setup link (#k=<key>) saves it once; the fragment never
  // reaches the server and is removed from the address bar right away.
  var m = location.hash.match(/[#&]k=([0-9a-f]{32,128})/i);
  if (m) { setKey(m[1]); history.replaceState(null, "", location.pathname); }
  if (!getKey()) $("keyCard").classList.remove("hidden");
  $("saveKey").onclick = async function () {
    setKey($("key").value.trim());
    status($("keyStatus"), "Checking…");
    try { await api("GET", "/config"); status($("keyStatus"), "Connected ✓", "ok"); }
    catch (e) { status($("keyStatus"), e.message, "err"); }
  };


  // reply
  $("getReply").onclick = async function () {
    var msg = $("msg").value.trim();
    if (!getKey()) return status($("status"), "Save your access key first.", "err");
    if (!msg) return status($("status"), "Paste their message first.", "err");
    var btn = this, id = rid("m");
    busy(btn, true); status($("status"), "Writing a draft… (usually 5–20 seconds)");
    try {
      await api("POST", "/ingest", { thread_id: id, text: msg });
      var d = await poll("/draft/" + encodeURIComponent(id), function (x) { return x.state === "PENDING_APPROVAL"; }, 120000);
      showDraft(d.draft_text); status($("status"), "Draft ready. Edit it, then Copy.", "ok");
    } catch (e) { status($("status"), e.message, "err"); }
    busy(btn, false, "Get suggestion");
  };


  // copy
  $("copy").onclick = async function () {
    var t = $("draft").value;
    try { await navigator.clipboard.writeText(t); }
    catch (e) { $("draft").select(); document.execCommand("copy"); }
    status($("status"), "Copied ✓ Now paste it in LinkedIn and press Send yourself.", "ok");
  };
})();
</script>
</body>
</html>
